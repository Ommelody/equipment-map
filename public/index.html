<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนผังตำแหน่งครุภัณฑ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>แผนผังตำแหน่งครุภัณฑ์ <small>ศูนย์การแพทย์ธรรมศาสตร์</small></h1>
  <button id="btnColL" class="ghost desk" title="ซ่อน/แสดงแผงซ้าย">◧</button><button id="btnColR" class="ghost desk" title="ซ่อน/แสดงแผงขวา">◨</button>
  <button id="btnLeft" class="ghost mob">☰ รายการ</button><button id="btnRight" class="ghost mob">ℹ︎ รายละเอียด</button>
  <div class="spacer"></div>
  <button id="btnTheme" class="ghost" title="สลับโหมดมืด/สว่าง">☾</button>
  <span id="syncState" class="sync" title="สถานะการบันทึก"></span>
  <label class="switch"><input type="checkbox" id="editMode"><span>โหมดปักหมุด</span></label>
  <button id="btnExport" class="ghost">ส่งออก</button>
  <button id="btnImport" class="ghost">นำเข้า</button>
  <input type="file" id="fileImport" accept="application/json" hidden>
</header>

<main>
  <aside id="left"><div class="rz" id="rzL" title="ลากเพื่อปรับความกว้าง (ดับเบิลคลิก = ค่าเริ่มต้น)"></div>
    <div class="tabs"><button data-tab="plans" class="on">แปลน</button><button data-tab="items">ครุภัณฑ์</button><button data-tab="photos">รูปภาพ</button><button data-tab="registry">ทะเบียน</button><button data-tab="progress">ความคืบหน้า</button></div>
    <div class="filters">
      <select id="catSel"></select>
      <input id="q" type="search" placeholder="ค้นหา ชื่อ / ยี่ห้อ / รุ่น / สถานที่">
      <select id="floorSel" hidden></select>
      <label class="chk" id="pinFilterWrap" hidden><input type="checkbox" id="onlyUnpinned"> เฉพาะที่ยังไม่ปักหมุด</label>
    </div>
    <div id="list"></div>
  </aside>

  <section id="viewer">
    <div class="toolbar">
      <b id="planTitle">เลือกแปลนทางซ้าย</b>
      <button id="btnPlanItems" class="ghost" hidden>ดูครุภัณฑ์ของแปลนนี้</button>
      <button id="btnRooms" class="ghost">🏠 กำหนดจุดห้อง</button>
      <div class="spacer"></div>
      <span id="pageCtl" hidden><button id="pgPrev" class="ghost">‹</button> หน้า <span id="pgNum">1</span>/<span id="pgTot">1</span> <button id="pgNext" class="ghost">›</button></span>
      <button id="zOut" class="ghost">−</button><span id="zLbl">100%</span><button id="zIn" class="ghost">+</button><button id="zFit" class="ghost">พอดีจอ</button>
      <select id="pinColor" style="width:auto" title="สีหมุด"><option value="cat">สีตามหมวด</option><option value="status">สีตามสถานะจับคู่</option></select>
      <label class="chk"><input type="checkbox" id="showLabels" checked> ชื่อหมุด</label>
    </div>
    <div id="editBar" hidden></div>
    <div id="scroller"><div id="stage"><canvas id="cv"></canvas><div id="pins"></div></div><div id="msg">เลือกแปลนจากรายการเพื่อเริ่มดู</div></div>
  </section>

  <section id="gallery" hidden>
    <div class="toolbar"><b id="galTitle">รูปภาพครุภัณฑ์</b><div class="spacer"></div><span class="muted" id="galCount"></span></div>
    <div id="galChips"></div>
    <div id="galGrid"></div>
  </section>

  <section id="registry" hidden>
    <div class="toolbar"><b>ทะเบียนครุภัณฑ์</b><span class="muted" id="regCount"></span><div class="spacer"></div><button id="regCsv" class="ghost">ดาวน์โหลด CSV (ที่กรองอยู่)</button></div>
    <div id="regFilters">
      <input id="regQ" type="search" placeholder="ค้นหา เลขครุภัณฑ์ / ชื่อ / ยี่ห้อ / รุ่น / Serial / ห้อง / แผนก">
      <select id="regFloor"></select><select id="regStatus"></select><select id="regDept"></select>
      <select id="regMatch"><option value="">จับคู่: ทั้งหมด</option><option value="m">จับคู่กับเอกสารแล้ว</option><option value="u">ยังไม่จับคู่</option><option value="p">ปักหมุดแล้ว</option><option value="np">ยังไม่ปักหมุด</option></select>
    </div>
    <div id="regWrap"><table id="regTable"></table></div>
    <div id="regPager"></div>
  </section>

  <aside id="right"><div class="rz rzr" id="rzR" title="ลากเพื่อปรับความกว้าง (ดับเบิลคลิก = ค่าเริ่มต้น)"></div>
    <div id="detail"><p class="muted">คลิกหมุดบนแปลน หรือเลือกรายการครุภัณฑ์ เพื่อดูรายละเอียดและรูปภาพ</p></div>
  </aside>
</main>

<div id="lightbox" hidden><div class="lbBox"><img id="lbImg" alt=""><div id="lbInfo"></div></div><button id="lbClose">✕</button></div>
<div id="dlg" class="dlg" hidden></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
