name = "equipment-map"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# Create these first (see README):
#   npx wrangler kv namespace create STATE      -> paste the id below
#   npx wrangler r2 bucket create equipment-assets
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "equipment-assets"
